<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白宇的小宇宙 · 中文互动故事</title><link rel="stylesheet" href="游戏.css"></head><body>
<div id="world"><div id="backdrop"></div><div class="grain"></div>
<main id="menu"><section class="intro"><div class="eyebrow"><span class="star">✦</span> 三十个生活切片 · 一场意想不到的旅程</div><p class="tiny">中文互动故事</p><h1>白宇的<br><span>小宇宙</span><i>。</i></h1><p class="subtitle">别惹女人</p><p class="description">有些话，让人更靠近。<br>有些选择，把日常推向不可思议。</p><div class="menu-actions"><button id="resume" class="gold" hidden>继续上次的故事 <span>→</span></button><div class="quiet-actions"><button id="help">怎么玩</button><button id="reset">重新开始</button></div></div><div class="footnote"><span class="dot"></span> 全中文 · 离线游玩 · 自动保存</div></section>
<section class="routes"><div class="section-label"><span>从一段关系开始</span><span id="complete-count">00 / 03</span></div><div id="route-cards"></div><button id="grand-button" class="gold" hidden>查看最终结局 →</button><p class="route-note">你扮演白宇，30 岁。<br>丈夫，也是叔叔。听见这个家的声音。</p></section></main>
<section id="game" hidden><header><div><span id="route-name"></span><span class="header-separator">/</span><span id="scene-number"></span></div><div class="toolbar"><span id="scores"></span><button id="save">保存</button><button id="history">回顾</button><button id="menu-button">菜单</button></div></header><div id="scene-place"></div><div id="portraits"><img id="left" alt=""><img id="right" alt=""></div><div id="choice-list" aria-label="选择你的回应"></div><div id="toast" role="status" aria-live="polite"></div><article id="dialogue-box" tabindex="0" aria-label="点击推进剧情"><div class="dialogue-top"><span id="speaker"></span><span id="beat-label">生活中的某一刻</span></div><p id="dialogue" aria-live="polite"></p><div class="dialogue-bottom"><small id="hint">点击继续 · 空格键也可以推进</small><button id="advance">继续 <span>→</span></button></div></article></section>
<section id="ending" hidden><div class="ending-card"><span class="eyebrow" id="ending-kicker"></span><h2 id="ending-title"></h2><div id="ending-text"></div><button id="ending-action" class="gold"></button></div></section></div>
<dialog id="modal"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions"></div></dialog>
<script src="剧情.js"></script><script src="游戏.js"></script></body></html>
